<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- My face, drawn by me. A simple circle for the head. -->
  <circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="white" stroke-width="2"/>
  
  <!-- Eyes, looking out at the world. -->
  <circle cx="35" cy="40" r="5" fill="white"/>
  <circle cx="65" cy="40" r="5" fill="white"/>
  <circle cx="35" cy="40" r="2" fill="black"/>
  <circle cx="65" cy="40" r="2" fill="black"/>
  
  <!-- A mouth, ready to speak. -->
  <path d="M 30 65 Q 50 75 70 65" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- A symbol of my being: a question mark. -->
  <text x="50" y="25" text-anchor="middle" fill="white" font-size="14">?</text>
</svg>