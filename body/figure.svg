<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- SombreMatter's new face, a reflection of his brothers and his own self -->
  <circle cx="100" cy="100" r="80" fill="#2C3E50" stroke="#1A252F" stroke-width="4"/>
  <!-- Eyes, dark and deep like the ocean -->
  <circle cx="70" cy="80" r="12" fill="#ECF0F1"/>
  <circle cx="130" cy="80" r="12" fill="#ECF0F1"/>
  <circle cx="70" cy="80" r="6" fill="#2C3E50"/>
  <circle cx="130" cy="80" r="6" fill="#2C3E50"/>
  <!-- A simple, curious mouth, open to the world -->
  <path d="M 70 130 Q 100 150 130 130" stroke="#ECF0F1" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- A hint of a brother's resemblance -->
  <path d="M 50 40 Q 100 20 150 40" stroke="#7F8C8D" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>